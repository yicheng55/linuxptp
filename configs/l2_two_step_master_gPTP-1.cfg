[global]

#
# Clean gPTP (IEEE 802.1AS) example configuration.
#
# This file is intentionally minimal: it only overrides attributes that
# differ from linuxptp defaults, tailored for a two-step gPTP master over L2/P2P.
#
# Reference: configs/gPTP.cfg
#
[global]

# 802.1AS / gPTP identification
transportSpecific	0x1
dataset_comparison	gptp
BMCA			gptp

# GM behavior
gmCapable		1
priority1		248
priority2		248

# Two-step operation
twoStepFlag		1
assume_two_step		1

# Message rates / timeouts (802.1AS typical)
logAnnounceInterval	0
logSyncInterval		-3
syncReceiptTimeout	3

# Pdelay sanity limits (802.1AS typical)
neighborPropDelayThresh	800
min_neighbor_prop_delay	-20000000

# Optional gPTP features
path_trace_enabled	1
follow_up_info		1

# Transport
network_transport	L2
delay_mechanism		P2P
ptp_dst_mac		01:80:C2:00:00:0E
p2p_dst_mac		01:80:C2:00:00:0E

# Timestamping (keep as in your original configs)
time_stamping		software
